[package]
name = "api-fake-tauri"
version = "0.1.0"
edition = "2021"
description = "Janela nativa (Tauri) que encapsula a interface web do api-fake -- ver README.md desta pasta pro contrato de entrada."
publish = false

[[bin]]
name = "api-fake-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
